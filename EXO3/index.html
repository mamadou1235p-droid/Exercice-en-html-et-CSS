<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Produit</title>
</head>
<body>
    <!-- 
        Formulaire de produit 
            > ID
            > Nom du produit
            > Description
            > Prix
            > Quantité
            > Catégorie
            > Image
            > unité de mesure
            > Marque
            > État
            > Date de création
            > Date de mise à jour
    -->

    <h1>La Formulaire de Produit</h1>
    <label for="ID">ID :</label>
    <textarea name="Id" id="Id" placeholder="Entrez votre Id"></textarea><br><br>

    <label for="name">Nom du produit :</label>
    <input type="text" placeholder="Entrez le nom de votre produit"> <br><br>

    <label for="Description">Description :</label>
    <input type="text" placeholder="Entrez votre description"> <br><br>

    <label for="Prix">Le prix du produit :</label>
    <input type="number" placeholder="Entrez le prix"> <br><br>

    <label for="Quantité">Quantité du produit :</label>
    <input type="number" placeholder="Entrez le nombre de votre quantité"> <br><br>

    <label for="Catégorie">Catégorie :</label>
    <input type="catégorie" placeholder="Quel est votre catégorie ?"> <br><br>

    <img src="c:\Users\FORMA-PLUS\Desktop\vendre-un-produit-02.png" alt="Mes produit">
    
    <label for="unité">Unité de mesure</label>
    <input type="Unité de mesure" placeholder="Quel est votre unité de mesure ?"> <br><br>

    <label for="Marque">Marque</label>
    <input type="Marque" placeholder="Quel est votre Marque"><br><br>

    <label for="Etat">Etat</label>
    <input type="text" placeholder="Quel est l'état de votre produit"> <br><br>

    <label for="Date">Date de création</label>
    <input type="date" placeholder="Entrez la date de création"> <br><br>

    <label for="date">Date de mis à jour</label>
    <input type="date" placeholder="Entrez la date de mis à jour">

    
</body>
</html>
